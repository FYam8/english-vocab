name: Waseda compatibility ownership guard

on:
  push:
    branches:
      - refactor/waseda-common-engine-v1
    paths:
      - src/common-engine/**
      - src/waseda-bootstrap/compat-ownership.json
      - src/waseda-bootstrap/engine-extraction-readiness.json
      - src/waseda-bootstrap/15-waseda-persistence.js
      - src/waseda-bootstrap/20-engine-candidate.js
      - src/waseda-bootstrap/30-compat-runtime.js
      - src/waseda-bootstrap/31-waseda-session-runtime.js
      - src/waseda-bootstrap/31a-waseda-planning-policy.js
      - src/waseda-bootstrap/32-session-planning-runtime.js
      - src/waseda-bootstrap/33-v75-ui-runtime.js
      - src/waseda-bootstrap/34-waseda-memory-policy.js
      - src/waseda-bootstrap/35-v76-memory-runtime.js
      - src/waseda-bootstrap/36-v76-engine-integration.js
      - src/waseda-bootstrap/37-v76-waseda-ui-runtime.js
      - tools/common_engine_compat_ownership_test.mjs
      - tools/common_engine_extraction_readiness_test.mjs
      - tools/common_engine_policy_contract_test.mjs
      - tools/common_engine_policy_validation_test.mjs
      - tools/common_engine_session_planning_contract_test.mjs
      - tools/common_engine_session_planning_validation_test.mjs
      - tools/waseda_memory_policy_adapter_test.mjs
      - tools/waseda_memory_scoring_policy_adapter_test.mjs
      - tools/waseda_foundation_reason_policy_adapter_test.mjs
      - tools/extract_waseda_memory_policy_adapter.py
      - tools/extract_waseda_memory_scoring_policy_adapter.py
      - tools/extract_waseda_foundation_reason_policy_adapter.py
      - .github/workflows/compat-ownership-guard.yml
  pull_request:
    branches:
      - main
    paths:
      - src/common-engine/**
      - src/waseda-bootstrap/compat-ownership.json
      - src/waseda-bootstrap/engine-extraction-readiness.json
      - src/waseda-bootstrap/15-waseda-persistence.js
      - src/waseda-bootstrap/20-engine-candidate.js
      - src/waseda-bootstrap/30-compat-runtime.js
      - src/waseda-bootstrap/31-waseda-session-runtime.js
      - src/waseda-bootstrap/31a-waseda-planning-policy.js
      - src/waseda-bootstrap/32-session-planning-runtime.js
      - src/waseda-bootstrap/33-v75-ui-runtime.js
      - src/waseda-bootstrap/34-waseda-memory-policy.js
      - src/waseda-bootstrap/35-v76-memory-runtime.js
      - src/waseda-bootstrap/36-v76-engine-integration.js
      - src/waseda-bootstrap/37-v76-waseda-ui-runtime.js
      - tools/common_engine_compat_ownership_test.mjs
      - tools/common_engine_extraction_readiness_test.mjs
      - tools/common_engine_policy_contract_test.mjs
      - tools/common_engine_policy_validation_test.mjs
      - tools/common_engine_session_planning_contract_test.mjs
      - tools/common_engine_session_planning_validation_test.mjs
      - tools/waseda_memory_policy_adapter_test.mjs
      - tools/waseda_memory_scoring_policy_adapter_test.mjs
      - tools/waseda_foundation_reason_policy_adapter_test.mjs
      - tools/extract_waseda_memory_policy_adapter.py
      - tools/extract_waseda_memory_scoring_policy_adapter.py
      - tools/extract_waseda_foundation_reason_policy_adapter.py
      - .github/workflows/compat-ownership-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check ownership, extraction and policy guards
        run: |
          node --check tools/common_engine_compat_ownership_test.mjs
          node --check tools/common_engine_extraction_readiness_test.mjs
          node --check tools/common_engine_policy_contract_test.mjs
          node --check tools/common_engine_policy_validation_test.mjs
          node --check tools/common_engine_session_planning_contract_test.mjs
          node --check tools/common_engine_session_planning_validation_test.mjs
          node --check tools/waseda_memory_policy_adapter_test.mjs
          node --check tools/waseda_memory_scoring_policy_adapter_test.mjs
          node --check tools/waseda_foundation_reason_policy_adapter_test.mjs
          python3 -m py_compile tools/extract_waseda_memory_policy_adapter.py
          python3 -m py_compile tools/extract_waseda_memory_scoring_policy_adapter.py
          python3 -m py_compile tools/extract_waseda_foundation_reason_policy_adapter.py
      - name: Enforce Waseda/common ownership boundary
        run: node tools/common_engine_compat_ownership_test.mjs
      - name: Enforce extraction readiness classification
        run: node tools/common_engine_extraction_readiness_test.mjs
      - name: Pin completed pure-helper extraction
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync('src/waseda-bootstrap/engine-extraction-readiness.json','utf8'));
          assert.equal(r.fifthPromotion,'v76LapseStability');
          assert.equal(r.fifthPromotionStatus,'promoted');
          assert.equal(r.readySchoolNeutralHelpers.length,0);
          const p=r.promotedSchoolNeutralHelpers.map(x=>x.symbol);
          assert.deepEqual(p,[
            'v75WeightedWithoutReplacement',
            'v76Clamp',
            'v76SeedStability',
            'v76IntervalForTarget',
            'v76LapseStability'
          ]);
          console.log('pure-helper extraction exact-head checkpoint: PASS');
          JS
      - name: Enforce school-neutral policy contract
        run: node tools/common_engine_policy_contract_test.mjs
      - name: Enforce policy-contract validation checkpoint
        run: node tools/common_engine_policy_validation_test.mjs
      - name: Enforce Waseda session-planning policy contract
        run: node tools/common_engine_session_planning_contract_test.mjs
      - name: Enforce session-planning validation checkpoint
        run: node tools/common_engine_session_planning_validation_test.mjs
      - name: Pin Waseda memory policy adapter boundary
        run: node tools/waseda_memory_policy_adapter_test.mjs
      - name: Pin Waseda memory scoring policy adapter boundary
        run: node tools/waseda_memory_scoring_policy_adapter_test.mjs
      - name: Pin Waseda foundation reason policy adapter boundary
        run: node tools/waseda_foundation_reason_policy_adapter_test.mjs
      - name: Confirm adapter scope remains Waseda-only
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const v=JSON.parse(fs.readFileSync('src/common-engine/policy-contract-validation.json','utf8'));
          const p=JSON.parse(fs.readFileSync('src/common-engine/session-planning-contract-validation.json','utf8'));
          assert.equal(v.approvedRuntimeBoundary,'memory-scheduler-policy-adapter');
          assert.equal(v.allowWasedaAdapterIntroduction,true);
          assert.equal(v.allowWasedaScoringAdapterIntroduction,true);
          assert.equal(v.allowRikkyoRuntimeMutation,false);
          assert.equal(v.allowProductionMainMutation,false);
          assert.equal(v.allowSharedRuntimeArtifactRelease,false);
          assert.equal(v.wasedaMemoryScoringPolicyAdapterValidation.validatedHead,'d2fec5e326564b5af46406fd3360887ad9ce5d9a');
          assert.equal(v.wasedaMemoryScoringPolicyAdapterValidation.artifactSha256,'5315e82069688b7bef265d2057e618f88afa1cdc2b31b051f7746ae8000d8463');
          assert.equal(v.nextBoundary.name,'session-planning-policy-adapter');
          assert.equal(v.nextBoundary.status,'contract-definition-only');
          assert.equal(v.nextBoundary.allowRuntimeMutation,false);
          assert.equal(p.allowFullPlanningRuntimeMutation,false);
          assert.equal(p.allowFirstPlanningAdapterGroupIntroduction,true);
          assert.equal(p.firstApprovedGroup,'foundation-reason-policy-adapter');
          assert.equal(p.firstPlanningAdapterCandidate.runtimeHead,'44a277acdc3703147cfe1a30ee873597b286a3a7');
          assert.equal(p.firstPlanningAdapterCandidate.artifactSha256,'3cbd1e048d40ae59b4b8e2ac4ed6922b75a93b765bbe250001ecc2833d6447c0');
          assert.equal(p.firstPlanningAdapterCandidate.status,'awaiting-exact-head-validation');
          console.log('Waseda-only adapter scope: PASS');
          JS
      - name: Diff hygiene
        run: git diff --check
