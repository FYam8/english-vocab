name: Assemble Waseda app from engine sources

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/waseda-common-engine-v1
    paths:
      - src/waseda-bootstrap/**
      - tools/assemble_waseda.py
      - .github/workflows/assemble-common-engine.yml

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop if Waseda production baseline moved
        run: |
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "531d505c19a86eaa2c8bbc4b25179de8089ab585"

      - name: Assemble production artifact from source parts
        run: python3 tools/assemble_waseda.py --write

      - name: Syntax-check split JavaScript sources
        run: |
          node --check src/waseda-bootstrap/10-waseda-data.js
          node --check src/waseda-bootstrap/15-waseda-persistence.js
          node --check src/waseda-bootstrap/20-engine-candidate.js
          node --check src/waseda-bootstrap/30-compat-runtime.js

      - name: Protect Waseda cloud sync and diff hygiene
        run: |
          git diff --exit-code 531d505c19a86eaa2c8bbc4b25179de8089ab585...HEAD -- progress-sync.js
          git diff --check

      - name: Commit generated artifact and refreshed manifest
        run: |
          if [ -z "$(git status --porcelain -- index.html src/waseda-bootstrap/manifest.json)" ]; then
            echo "Generated Waseda artifact already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/waseda-bootstrap/manifest.json
          git commit -m "build: assemble Waseda app from engine sources"
          git push origin HEAD:refactor/waseda-common-engine-v1
