name: v7.6 memory-curve implementation and two-pass QA

on:
  push:
    branches:
      - feature/v7.6-memory-curve-scheduler
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply adaptive forgetting-curve scheduler
        run: |
          node --check tools/v76_memory_scheduler.js
          python3 tools/apply_v76_memory_scheduler.py
          cp index.html /tmp/index-after-v76.html
          python3 tools/apply_v76_memory_scheduler.py
          cmp index.html /tmp/index-after-v76.html
          echo "patch idempotence: PASS"

      - name: Existing-user protection static gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'const SCHEMA_VERSION=7;' in s
          assert 'const STORAGE_KEY="waseshibu_vocab_state";' in s
          assert 'localStorage.clear(' not in s
          assert 'localStorage.removeItem(STORAGE_KEY)' not in s
          assert 'waseshibu_vocab_active_session_v1' in s
          assert '2019-2026-v7.6-memory-curve-scheduler' in s
          assert s.count('/* V76_MEMORY_CURVE_SCHEDULER_START */') == 1
          assert s.count('/* V76_MEMORY_CURVE_SCHEDULER_END */') == 1
          assert 'memoryModel' in s
          assert 'const VOCAB=' in s
          print('existing-user static gate: PASS')
          PY

      - name: Assemble regression tests
        run: |
          cat tools/v75_browser_test.part*.mjs > /tmp/v75_browser_test.mjs
          cp tools/v75_content_browser_test.mjs /tmp/v75_content_browser_test.mjs
          cp tools/v76_memory_browser_test.mjs /tmp/v76_memory_browser_test.mjs
          sed -i 's/2019-2026-v7.5-user-test-remediation/2019-2026-v7.6-memory-curve-scheduler/g' /tmp/v75_browser_test.mjs /tmp/v75_content_browser_test.mjs
          node --check /tmp/v75_browser_test.mjs
          node --check /tmp/v75_content_browser_test.mjs
          node --check /tmp/v76_memory_browser_test.mjs

      - name: Install Playwright Chromium
        run: |
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v76-http.log 2>&1 &
          echo $! >/tmp/v76-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v76-http.log
          exit 1

      - name: USER-PASS-1
        env:
          NODE_PATH: /tmp/node_modules
          V75_TEST_URL: http://127.0.0.1:4173/index.html
          V75_PASS: USER-PASS-1
          V76_TEST_URL: http://127.0.0.1:4173/index.html
          V76_PASS: USER-PASS-1
        run: |
          node /tmp/v75_browser_test.mjs
          node /tmp/v75_content_browser_test.mjs
          node /tmp/v76_memory_browser_test.mjs

      - name: USER-PASS-2
        env:
          NODE_PATH: /tmp/node_modules
          V75_TEST_URL: http://127.0.0.1:4173/index.html
          V75_PASS: USER-PASS-2
          V76_TEST_URL: http://127.0.0.1:4173/index.html
          V76_PASS: USER-PASS-2
        run: |
          node /tmp/v75_browser_test.mjs
          node /tmp/v75_content_browser_test.mjs
          node /tmp/v76_memory_browser_test.mjs

      - name: Final diff hygiene
        run: |
          git diff --check
          sha256sum index.html

      - name: Commit implementation to feature branch
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Implement v7.6 adaptive forgetting-curve scheduler"
          git push origin HEAD:feature/v7.6-memory-curve-scheduler
