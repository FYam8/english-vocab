name: v7.5 exhaustive content audit

on:
  push:
    branches:
      - fix/v7.5-user-test-remediation
    paths:
      - index.html
      - tools/audit_v75_content.mjs
      - .github/workflows/v75-content-audit.yml

permissions:
  contents: write

jobs:
  audit-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v7.5-user-test-remediation
          fetch-depth: 0
      - name: Run exhaustive example audit
        run: node tools/audit_v75_content.mjs
      - name: Commit audit evidence
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- qa/content-audit)" ]; then
            echo "audit output unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/content-audit
          git commit -m "Record v7.5 exhaustive content audit evidence"
          git push origin HEAD:fix/v7.5-user-test-remediation
